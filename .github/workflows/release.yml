name: release

# Pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
# tests the code, builds the release tarball and publishes it as a GitHub
# Release. "Run workflow" in the Actions tab does a dry run that only uploads
# the tarball as a build artifact (no Release is created).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed to create the GitHub Release

jobs:
  build:
    # An older Ubuntu on purpose: the binary links against the build machine's
    # glibc, so building on an old one lets it run on most current distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install a current Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Check the tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$cargo_version" != "$tag_version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $cargo_version"
            exit 1
          fi

      # The tests render real PDFs, so they need libpdfium.so in vendor/pdfium/.
      - name: Fetch Pdfium
        run: ./scripts/fetch-pdfium.sh

      - name: Test
        run: cargo test --locked

      - name: Package
        run: ./scripts/package-release.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rumpress-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
            --title "rumpress $GITHUB_REF_NAME" \
            --generate-notes
