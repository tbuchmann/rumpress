[package]
name = "rumpress"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = { version = "0.33", features = ["wayland"] }
egui = "0.33"
env_logger = "0.11"
log = "0.4"
notify = "8"
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "thread_safe"] }
thiserror = "2"
