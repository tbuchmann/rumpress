[package]
name = "rumpress"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
eframe = { version = "0.33", features = ["wayland"] }
egui = "0.33"
env_logger = "0.11"
log = "0.4"
notify = "8"
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "thread_safe"] }
serde_json = "1"
thiserror = "2"

# Smaller, faster release binaries for distribution (at the cost of a longer
# release build): link-time optimization across all crates, a single codegen
# unit, and stripped symbols.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
